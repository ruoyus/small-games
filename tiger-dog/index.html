<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>机械老虎来啦！· 小狗草地大逃亡</title>
<meta name="description" content="一个超小的网页小游戏：在草地上躲开机械老虎，捡骨头，活得越久越好。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='88'%3E%F0%9F%90%AF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#2b2f26;
    --ink-soft:#5b6455;
    --card:rgba(255,255,255,.92);
    --line:rgba(43,47,38,.12);
    --accent:#e0642f;
    --accent2:#2f8f4e;
    --shadow:0 18px 50px -18px rgba(24,42,20,.45);
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Nunito", system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; background:#5ea83f; }
  body{
    font-family:var(--font); color:var(--ink);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #game{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud{ position:fixed; inset:0; pointer-events:none; padding:14px clamp(12px,3vw,26px); }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .pill{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; box-shadow:0 6px 18px -10px rgba(24,42,20,.5);
    display:flex; align-items:center; gap:9px; line-height:1;
  }
  .pill .lbl{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .pill .val{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stack{ display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .stack.right{ align-items:flex-end; }

  #staminaWrap{ width:clamp(120px,26vw,190px); }
  #staminaBar{
    height:9px; border-radius:999px; background:rgba(43,47,38,.14); overflow:hidden; margin-top:8px;
  }
  #staminaFill{
    height:100%; width:100%; border-radius:999px;
    background:linear-gradient(90deg,#3fae5f,#8fd94a);
    transition:background .2s;
  }
  #staminaFill.low{ background:linear-gradient(90deg,#d94a3a,#f0a03a); }
  .tiny{ font-size:12px; font-weight:700; color:var(--ink-soft); }
  #alertTag{
    background:rgba(214,58,32,.94); color:#fff; border-color:transparent;
    opacity:0; transform:translateY(-6px) scale(.94); transition:.18s ease;
  }
  #alertTag.on{ opacity:1; transform:none; }

  #btns{ position:fixed; right:clamp(12px,3vw,26px); bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:auto; }
  .iconbtn{
    width:44px; height:44px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); box-shadow:0 6px 18px -10px rgba(24,42,20,.5);
    font-size:19px; display:grid; place-items:center; cursor:pointer; padding:0;
    color:var(--ink); font-family:var(--font);
  }
  .iconbtn:active{ transform:scale(.94); }
  .iconbtn.off{ opacity:.45; }

  #backlink{
    position:fixed; left:clamp(12px,3vw,26px); bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:6; display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--ink-soft); font-size:13px; font-weight:800;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:9px 15px; box-shadow:0 6px 18px -10px rgba(24,42,20,.5);
  }
  #backlink:active{ transform:scale(.96); }

  #dashBtn{
    position:fixed; right:calc(22px + env(safe-area-inset-right)); bottom:calc(74px + env(safe-area-inset-bottom));
    width:84px; height:84px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
    background:linear-gradient(180deg,#ffb43c,#e0642f); color:#fff; font-family:var(--font);
    font-size:15px; font-weight:800; letter-spacing:.06em; display:none; place-items:center;
    box-shadow:0 12px 26px -10px rgba(120,50,10,.7); pointer-events:auto;
  }
  #dashBtn:active{ transform:scale(.93); }

  /* ---------- Overlays ---------- */
  .screen{
    position:fixed; inset:0; display:grid; place-items:center; padding:20px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,.22), rgba(20,40,15,.5));
    backdrop-filter:blur(3px); z-index:5;
  }
  .screen[hidden]{ display:none; }
  .card{
    width:min(560px,100%); background:var(--card); border-radius:28px; padding:clamp(24px,4.5vw,38px);
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.7); text-align:center;
    max-height:94vh; overflow:auto;
  }
  .badge{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent); background:rgba(224,100,47,.1); border-radius:999px; padding:5px 12px;
  }
  h1{ font-size:clamp(26px,6vw,40px); margin:14px 0 6px; letter-spacing:-.02em; }
  h1 .em{ color:var(--accent); }
  .sub{ color:var(--ink-soft); font-size:clamp(13px,2.6vw,15px); margin:0 0 18px; line-height:1.6; }
  .keys{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 20px; }
  .key{
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
    border:1px solid var(--line); background:rgba(255,255,255,.7); border-radius:12px; padding:8px 12px;
  }
  .key b{ color:var(--ink); font-weight:800; }
  button.cta{
    appearance:none; border:0; cursor:pointer; font-family:var(--font);
    background:linear-gradient(180deg,#f0803f,#dd5a22); color:#fff;
    font-size:17px; font-weight:800; letter-spacing:.02em;
    padding:15px 40px; border-radius:999px; box-shadow:0 14px 28px -12px rgba(190,70,20,.85);
    transition:transform .12s;
  }
  button.cta:active{ transform:translateY(2px) scale(.98); }
  .scoreRow{ display:flex; gap:10px; justify-content:center; margin:6px 0 20px; }
  .scoreBox{
    flex:1; max-width:150px; border:1px solid var(--line); border-radius:18px;
    padding:12px 8px; background:rgba(255,255,255,.66);
  }
  .scoreBox .k{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .scoreBox .v{ font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
  .newbest{ color:var(--accent); font-weight:800; font-size:13px; margin:-10px 0 14px; }
  .foot{ margin-top:16px; font-size:12px; color:var(--ink-soft); }
  .pair{ display:flex; gap:8px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.7); color:var(--ink-soft);
  }
  .chip i{ font-style:normal; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="stack">
      <div class="pill"><span class="lbl">得分</span><span class="val" id="scoreV">0</span></div>
      <div class="pill"><span class="lbl">最佳</span><span class="val" id="bestV">0</span></div>
    </div>
    <div class="stack right">
      <div class="pill" id="alertTag"><span class="tiny" style="color:#fff">⚠ 被发现了！快跑！</span></div>
      <div class="pill" id="staminaWrap">
        <div style="flex:1">
          <div class="lbl" style="font-size:10px">体力 DASH</div>
          <div id="staminaBar"><div id="staminaFill"></div></div>
        </div>
      </div>
      <div class="pill"><span class="lbl">时间</span><span class="val" id="timeV">0.0</span></div>
    </div>
  </div>
</div>

<a id="backlink" href="../">← 小游戏</a>

<div id="btns">
  <button class="iconbtn" id="muteBtn" title="声音开关 (M)">🔊</button>
  <button class="iconbtn" id="fsBtn" title="全屏">⛶</button>
</div>
<button id="dashBtn">冲刺</button>

<div class="screen" id="startScreen">
  <div class="card">
    <span class="badge">小游戏 · Mini Game</span>
    <h1>机械老虎<span class="em">来啦</span>！</h1>
    <p class="sub">你是草地上的一只小狗 🐶<br>躲开红色的机械老虎 🐯，<b>吃到骨头才加分</b>，被抓住就结束。</p>
    <div class="pair">
      <span class="chip"><i>🦴</i> 每根骨头 +10 分</span>
      <span class="chip"><i>⚡</i> 空格冲刺逃命</span>
      <span class="chip"><i>🌳</i> 躲进灌木丛可隐身</span>
    </div>
    <div class="keys">
      <span class="key"><b>WASD</b> / <b>方向键</b> 移动</span>
      <span class="key"><b>空格</b> 冲刺</span>
      <span class="key"><b>P</b> 暂停</span>
      <span class="key"><b>R</b> 重来</span>
    </div>
    <button class="cta" id="playBtn">开始游戏</button>
    <p class="foot">手机 / 平板：在屏幕上任意位置拖动即可控制方向，右下角按钮冲刺</p>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <span class="badge" style="color:#c0392b;background:rgba(192,57,43,.1)">Game Over</span>
    <h1 id="overTitle">被抓住啦！</h1>
    <p class="sub" id="overSub">虎口脱险失败…… 再来一次！</p>
    <div class="scoreRow">
      <div class="scoreBox"><div class="k">得分</div><div class="v" id="finalScore">0</div></div>
      <div class="scoreBox"><div class="k">坚持</div><div class="v" id="finalTime">0s</div></div>
      <div class="scoreBox"><div class="k">骨头</div><div class="v" id="finalBones">0</div></div>
    </div>
    <div class="newbest" id="newBest" hidden>🎉 新纪录！</div>
    <button class="cta" id="againBtn">再玩一次</button>
    <p class="foot">按 <b>R</b> 也可以马上重来</p>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   机械老虎来啦！— 一个自包含的 canvas 小游戏
   你 = 小狗。躲开机械老虎，捡骨头，活得越久越好。
   ============================================================ */

var cv = document.getElementById('game');
var ctx = cv.getContext('2d');

var el = {
  score: document.getElementById('scoreV'),
  best:  document.getElementById('bestV'),
  time:  document.getElementById('timeV'),
  stamina: document.getElementById('staminaFill'),
  alert: document.getElementById('alertTag'),
  start: document.getElementById('startScreen'),
  over:  document.getElementById('overScreen'),
  finalScore: document.getElementById('finalScore'),
  finalTime: document.getElementById('finalTime'),
  finalBones: document.getElementById('finalBones'),
  newBest: document.getElementById('newBest'),
  overTitle: document.getElementById('overTitle'),
  overSub: document.getElementById('overSub'),
  mute: document.getElementById('muteBtn'),
  fs: document.getElementById('fsBtn'),
  dash: document.getElementById('dashBtn')
};

/* ---------------- 自适应画布 ---------------- */
var W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  applyScale();
  buildField();
}
window.addEventListener('resize', resize);

/* ---------------- 工具 ---------------- */
function rand(a, b){ return a + Math.random() * (b - a); }
function randInt(a, b){ return Math.floor(rand(a, b + 1)); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function norm(a){ while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function lerp(a, b, t){ return a + (b - a) * t; }

/* ---------------- 声音（纯合成，无外部文件） ---------------- */
var sound = { on: true, ctx: null };
function audio(){
  if (!sound.ctx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    sound.ctx = new AC();
  }
  if (sound.ctx.state === 'suspended') sound.ctx.resume();
  return sound.ctx;
}
function tone(freq, dur, type, vol, slideTo){
  if (!sound.on) return;
  var c = audio(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, c.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), c.currentTime + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, c.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + dur + 0.02);
}
function noise(dur, vol, hp){
  if (!sound.on) return;
  var c = audio(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur);
  var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  var s = c.createBufferSource(); s.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 400;
  var g = c.createGain(); g.gain.value = vol || 0.12;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}

/* ---------------- 世界 ---------------- */
var MARGIN = 26;                    // 栅栏内边距
var state = 'menu';                 // menu | playing | over | paused
var dog, tiger, bones = [], bushes = [], flowers = [], tufts = [], puffs = [], sparks = [];
var score = 0, boneCount = 0, elapsed = 0, best = 0, shake = 0, catchT = 0, flash = 0;
var lastT = 0, runT = 0, graceT = 0;

try { best = parseInt(localStorage.getItem('roboTigerBest2') || '0', 10) || 0; } catch(e){ best = 0; }
el.best.textContent = best;

var DOG_SPEED = 200, DOG_ACCEL = 1500;
var DASH_SPEED = 500, DASH_TIME = 0.30, DASH_COST = 30, STAM_REGEN = 22, STAM_DELAY = 0.5;
// 场地越大，角色绝对速度越快；小屏（手机）按比例放慢，保证"每秒能跑过几屏"的体感一致
var SZ = 1, TIGER_BASE = 132, TIGER_RAMP = 4.2, TIGER_RAMP_MAX = 96;
function applyScale(){
  SZ = clamp(Math.sqrt((W * H) / 810000), 0.62, 1.10);
  DOG_SPEED = 200 * SZ;
  DOG_ACCEL = 1500 * SZ;
  DASH_SPEED = 500 * SZ;
}

function buildField(){
  // 草丛
  tufts = [];
  var n = Math.round((W * H) / 9000);
  n = clamp(n, 40, 190);
  for (var i = 0; i < n; i++){
    tufts.push({ x: rand(0, W), y: rand(0, H), h: rand(5, 13), w: rand(1.2, 2.4),
      hue: randInt(0, 3), ph: rand(0, 6.28), sp: rand(1.2, 2.6) });
  }
  flowers = [];
  for (var j = 0; j < 16; j++){
    flowers.push({ x: rand(30, W - 30), y: rand(30, H - 30), r: rand(3.2, 5.4),
      c: ['#fff8e6','#ffe8f0','#f4f0ff'][randInt(0,2)], ph: rand(0, 6.28) });
  }
}

function resetWorld(){
  dog = { x: W * 0.5, y: H * 0.68, vx: 0, vy: 0, r: 17, ang: -Math.PI / 2,
          stam: 100, dashT: 0, regenWait: 0, bob: 0, face: 1 };
  tiger = { x: W * 0.5, y: MARGIN + 70, vx: 0, vy: 0, r: 30, ang: Math.PI / 2,
            alert: false, alertT: 0, speed: 176, wp: null, legP: 0, seek: 0 };
  bones = []; bushes = [];
  var tries = 0;
  while (bushes.length < 6 && tries++ < 400){
    var b = { x: rand(MARGIN + 70, W - MARGIN - 70), y: rand(MARGIN + 70, H - MARGIN - 70), r: rand(30, 46) };
    if (dist2(b.x, b.y, dog.x, dog.y) < Math.pow(b.r + 90, 2)) continue;
    if (isBlockedForDog(b)) continue;
    bushes.push(b);
  }
  for (var i = 0; i < 6; i++) spawnBone(true);
  puffs = []; sparks = [];
  score = 0; boneCount = 0; elapsed = 0; shake = 0; catchT = 0; flash = 0; runT = 0;
  el.score.textContent = '0';
  el.time.textContent = '0.0';
  el.stamina.style.width = '100%';
  el.alert.classList.remove('on');
}

/* 让小狗出生点附近别被灌木堵死 */
function isBlockedForDog(b){
  var cx = W * 0.5, cy = H * 0.68, R = 160;
  return b.x + b.r > cx - R && b.x - b.r < cx + R && b.y + b.r > cy - R && b.y - b.r < cy + R;
}

function freeSpot(minFromTiger, minFromDog){
  for (var i = 0; i < 60; i++){
    var x = rand(MARGIN + 26, W - MARGIN - 26), y = rand(MARGIN + 26, H - MARGIN - 26);
    if (dist2(x, y, tiger.x, tiger.y) < minFromTiger * minFromTiger) continue;
    if (dist2(x, y, dog.x, dog.y) < minFromDog * minFromDog) continue;
    var ok = true;
    for (var j = 0; j < bushes.length; j++){
      if (dist2(x, y, bushes[j].x, bushes[j].y) < Math.pow(bushes[j].r + 22, 2)) { ok = false; break; }
    }
    if (ok) return { x: x, y: y };
  }
  return { x: rand(MARGIN + 26, W - MARGIN - 26), y: rand(MARGIN + 26, H - MARGIN - 26) };
}

function spawnBone(initial){
  var p = freeSpot((initial ? 150 : 190) * SZ, 70 * SZ);
  bones.push({ x: p.x, y: p.y, ph: rand(0, 6.28), born: runT });
}

/* ---------------- 输入 ---------------- */
var keys = {};
var stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
var touchDash = false, touchUsed = false;

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' ','spacebar'].indexOf(k) >= 0) e.preventDefault();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') tryDash();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'r' && state !== 'menu') startGame();
  if (k === 'm') toggleMute();
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', function(){ keys = {}; stick.active = false; });
// 切到别的标签页时自动暂停，回来不会被"偷袭"
document.addEventListener('visibilitychange', function(){
  if (document.hidden && state === 'playing') togglePause();
});

function localPos(e){
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', function(e){
  touchUsed = true;
  if (e.pointerType === 'touch') enableTouchUI();
  if (state !== 'playing') return;
  if (stick.active) return;
  stick.active = true; stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
  stick.x = e.clientX; stick.y = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', function(e){
  if (!stick.active || e.pointerId !== stick.id) return;
  stick.x = e.clientX; stick.y = e.clientY;
});
function endStick(e){
  if (e.pointerId === stick.id){ stick.active = false; stick.id = null; }
}
cv.addEventListener('pointerup', endStick);
cv.addEventListener('pointercancel', endStick);

function tryDash(){
  if (state !== 'playing') return;
  if (dog.stam < DASH_COST || dog.dashT > 0) return;
  dog.stam -= DASH_COST; dog.dashT = DASH_TIME; dog.regenWait = 0;
  noise(0.22, 0.1, 900);
  for (var i = 0; i < 10; i++){
    puffs.push({ x: dog.x, y: dog.y + 8, vx: rand(-90, 90) - dog.vx * .2, vy: rand(-60, 10),
      life: rand(.3, .6), max: .6, r: rand(3, 8), c: 'dust' });
  }
}

/* ---------------- 碰撞 ---------------- */
function pushOutOfBush(o, prevX, prevY){
  for (var i = 0; i < bushes.length; i++){
    var b = bushes[i];
    var dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy);
    var min = b.r + o.r * 0.72;
    if (d < min && d > 0.001){
      o.x = b.x + dx / d * min;
      o.y = b.y + dy / d * min;
      // 若两者都靠得很近，防卡住：沿原速度滑动
      if (prevX !== undefined && dist2(o.x, o.y, prevX, prevY) < 0.4){
        o.x += (dx / d) * 1.6; o.y += (dy / d) * 1.6;
      }
    }
  }
}
function bounds(o){
  o.x = clamp(o.x, MARGIN + o.r, W - MARGIN - o.r);
  o.y = clamp(o.y, MARGIN + o.r, H - MARGIN - o.r);
}
function segBlocked(x1, y1, x2, y2){
  for (var i = 0; i < bushes.length; i++){
    var b = bushes[i];
    var dx = x2 - x1, dy = y2 - y1;
    var len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? clamp(((b.x - x1) * dx + (b.y - y1) * dy) / len2, 0, 1) : 0;
    var px = x1 + dx * t, py = y1 + dy * t;
    if (dist2(px, py, b.x, b.y) < Math.pow(b.r * 0.92, 2)) return true;
  }
  return false;
}

/* ---------------- 更新 ---------------- */
function update(dt){
  runT += dt;

  /* ---- 小狗 ---- */
  var ax = 0, ay = 0;
  if (keys['a'] || keys['arrowleft'])  ax -= 1;
  if (keys['d'] || keys['arrowright']) ax += 1;
  if (keys['w'] || keys['arrowup'])    ay -= 1;
  if (keys['s'] || keys['arrowdown'])  ay += 1;

  if (stick.active){
    var sx = stick.x - stick.ox, sy = stick.y - stick.oy;
    var sl = Math.hypot(sx, sy);
    if (sl > 8){ var lim = Math.min(sl, 62) / 62; ax += sx / sl * lim; ay += sy / sl * lim; }
    if (sl > 62 * 0.82) tryDash();
  }
  if (ax || ay){ var l = Math.hypot(ax, ay); ax /= l; ay /= l; }

  if (dog.dashT > 0) dog.dashT -= dt;
  var targetSpeed = dog.dashT > 0 ? DASH_SPEED : DOG_SPEED;
  var tvx = ax * targetSpeed, tvy = ay * targetSpeed;
  var k = clamp(DOG_ACCEL * dt / Math.max(targetSpeed, 1), 0, 1);
  if (dog.dashT > 0) k = 1;
  dog.vx = lerp(dog.vx, tvx, k);
  dog.vy = lerp(dog.vy, tvy, k);

  var px = dog.x, py = dog.y;
  dog.x += dog.vx * dt; dog.y += dog.vy * dt;
  pushOutOfBush(dog, px, py);
  bounds(dog);

  var sp = Math.hypot(dog.vx, dog.vy);
  if (sp > 12){
    dog.ang = Math.atan2(dog.vy, dog.vx);
    dog.bob += dt * (6 + sp / 26);
  } else dog.bob += dt * 1.6;

  if (dog.regenWait > 0) dog.regenWait -= dt;
  else dog.stam = Math.min(100, dog.stam + STAM_REGEN * dt);
  el.stamina.style.width = dog.stam.toFixed(1) + '%';
  el.stamina.classList.toggle('low', dog.stam < 32);

  if (dog.dashT > 0 && Math.random() < 0.55){
    puffs.push({ x: dog.x - dog.vx * .02, y: dog.y + 7, vx: rand(-40, 40) - dog.vx * .12,
      vy: rand(-30, 0), life: .45, max: .45, r: rand(2.5, 6), c: 'dust' });
  }

  /* ---- 机械老虎 ---- */
  var d2 = dist2(tiger.x, tiger.y, dog.x, dog.y);
  var d = Math.sqrt(d2);
  var toDog = Math.atan2(dog.y - tiger.y, dog.x - tiger.x);
  var facing = Math.abs(norm(toDog - tiger.ang));
  var hidden = segBlocked(tiger.x, tiger.y, dog.x, dog.y);
  var sees = (d < 108 * SZ && !hidden) || (d < 380 * SZ && facing < 0.95 && !hidden);

  if (sees){ tiger.alert = true; tiger.alertT = 1.1; }
  else if (tiger.alertT > 0) tiger.alertT -= dt;
  else tiger.alert = false;

  // 开场倒计时：老虎原地待机，先给玩家一点反应时间
  var frozen = graceT > 0;
  if (frozen){
    graceT -= dt;
    tiger.alert = false; tiger.alertT = 0;
    tiger.vx = 0; tiger.vy = 0;
    tiger.legP += dt * 3;
    el.alert.classList.remove('on');
  } else {

  tiger.speed = lerp(tiger.speed,
    (TIGER_BASE + Math.min(elapsed * TIGER_RAMP, TIGER_RAMP_MAX) + (tiger.alert ? 12 : -14)) * SZ,
    1 - Math.pow(0.02, dt));

  var goalX, goalY, speedMul;
  if (tiger.alert){
    // 预判小狗位置，稍微提前量
    goalX = dog.x + dog.vx * 0.22; goalY = dog.y + dog.vy * 0.22;
    speedMul = 1;
  } else {
    if (!tiger.wp || dist2(tiger.x, tiger.y, tiger.wp.x, tiger.wp.y) < Math.pow(46, 2)){
      tiger.wp = { x: rand(MARGIN + 60, W - MARGIN - 60), y: rand(MARGIN + 60, H - MARGIN - 60) };
    }
    goalX = tiger.wp.x; goalY = tiger.wp.y; speedMul = 0.52;
  }

  var want = Math.atan2(goalY - tiger.y, goalX - tiger.x);
  var turn = 2.55 * dt * (tiger.alert ? 1 : 0.7);
  var diff = norm(want - tiger.ang);
  tiger.ang += clamp(diff, -turn, turn);
  tiger.ang = norm(tiger.ang);

  var tspd = tiger.speed * speedMul;
  tiger.vx = Math.cos(tiger.ang) * tspd;
  tiger.vy = Math.sin(tiger.ang) * tspd;
  tiger.x += tiger.vx * dt; tiger.y += tiger.vy * dt;
  pushOutOfBush(tiger);
  bounds(tiger);
  tiger.legP += dt * (tiger.alert ? 15 : 8);
  }

  // 排气烟
  if (Math.random() < (tiger.alert ? 0.5 : 0.18)){
    puffs.push({ x: tiger.x - Math.cos(tiger.ang) * (tiger.r - 6) + rand(-4, 4),
      y: tiger.y - Math.sin(tiger.ang) * (tiger.r - 6) + rand(-4, 4),
      vx: rand(-18, 18), vy: rand(-40, -8), life: .8, max: .8, r: rand(4, 9), c: 'smoke' });
  }
  if (tiger.alert) flash = Math.min(1, flash + dt * 3); else flash = Math.max(0, flash - dt * 2);

  el.alert.classList.toggle('on', tiger.alert);

  /* ---- 骨头 ---- */
  for (var i = bones.length - 1; i >= 0; i--){
    var b = bones[i];
    b.ph += dt * 3;
    if (dist2(b.x, b.y, dog.x, dog.y) < Math.pow(dog.r + 21, 2)){
      bones.splice(i, 1);
      boneCount++; score += 10;
      tone(880, .09, 'triangle', .14); setTimeout(function(){ tone(1320, .1, 'triangle', .12); }, 70);
      for (var s = 0; s < 12; s++){
        var a = rand(0, 6.283);
        sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * rand(40, 170), vy: Math.sin(a) * rand(40, 170) - 30,
          life: .55, max: .55, r: rand(2, 4.5), c: '#ffe9a8' });
      }
    }
  }
  while (bones.length < 6) spawnBone(false);

  /* ---- 抓到 ---- */
  if (!frozen && d < dog.r + tiger.r * 0.86){
    gameOver();
    return;
  }

  /* ---- 粒子 ---- */
  for (var pi = puffs.length - 1; pi >= 0; pi--){
    var p2 = puffs[pi];
    p2.life -= dt; p2.x += p2.vx * dt; p2.y += p2.vy * dt;
    p2.vy -= 12 * dt; p2.r += dt * (p2.c === 'smoke' ? 16 : 9);
    if (p2.life <= 0) puffs.splice(pi, 1);
  }
  for (var si = sparks.length - 1; si >= 0; si--){
    var s2 = sparks[si];
    s2.life -= dt; s2.x += s2.vx * dt; s2.y += s2.vy * dt; s2.vy += 260 * dt;
    if (s2.life <= 0) sparks.splice(si, 1);
  }

  /* ---- 计时（分数只在吃骨头时增加，见上面骨头那一段） ---- */
  if (!frozen) elapsed += dt;
  shake = Math.max(0, shake - dt * 26);
}

/* ---------------- 绘制 ---------------- */
function drawLawn(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7cc957');
  g.addColorStop(0.55, '#62b243');
  g.addColorStop(1, '#4d9a34');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 割草机条纹
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = '#ffffff';
  var band = 76;
  for (var x = -band; x < W + band; x += band * 2) ctx.fillRect(x, 0, band, H);
  ctx.restore();

  // 灌木 / 树的阴影感
  for (var i = 0; i < bushes.length; i++){
    var b = bushes[i];
    ctx.save();
    ctx.globalAlpha = 0.11;
    ctx.fillStyle = '#123a12';
    ctx.beginPath(); ctx.ellipse(b.x + 6, b.y + b.r * 0.72, b.r * 1.02, b.r * 0.36, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // 草叶
  for (var t = 0; t < tufts.length; t++){
    var f = tufts[t];
    var sway = Math.sin(runT * f.sp + f.ph) * 1.9;
    var col = ['rgba(46,120,40,.5)', 'rgba(120,200,90,.55)', 'rgba(255,255,255,.22)', 'rgba(30,90,30,.4)'][f.hue];
    ctx.strokeStyle = col; ctx.lineWidth = f.w; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.quadraticCurveTo(f.x + sway * .5, f.y - f.h * .6, f.x + sway, f.y - f.h);
    ctx.stroke();
  }

  // 小花
  for (var fl = 0; fl < flowers.length; fl++){
    var o = flowers[fl];
    var s = 1 + Math.sin(runT * 1.7 + o.ph) * 0.06;
    ctx.save(); ctx.translate(o.x, o.y); ctx.scale(s, s);
    ctx.globalAlpha = .9; ctx.fillStyle = o.c;
    for (var pt = 0; pt < 5; pt++){
      var a2 = pt / 5 * 6.2832 + o.ph;
      ctx.beginPath(); ctx.ellipse(Math.cos(a2) * o.r * .62, Math.sin(a2) * o.r * .62, o.r * .5, o.r * .34, a2, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = '#ffd65e';
    ctx.beginPath(); ctx.arc(0, 0, o.r * .34, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}

function drawFence(){
  ctx.save();
  var m = MARGIN, postGap = 46;
  ctx.globalAlpha = .85;
  // 内圈暗边（显得场地有边界）
  ctx.strokeStyle = 'rgba(38,86,26,.28)'; ctx.lineWidth = 8;
  ctx.strokeRect(m - 4, m - 4, W - (m - 4) * 2, H - (m - 4) * 2);
  // 木栏
  ctx.strokeStyle = '#c79a63'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(m, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, H - m); ctx.lineTo(m, H - m); ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(m, m + 3); ctx.lineTo(W - m, m + 3); ctx.lineTo(W - m, H - m - 3); ctx.lineTo(m, H - m - 3); ctx.closePath();
  ctx.stroke();
  // 柱子
  ctx.fillStyle = '#b0834f';
  var step = postGap;
  for (var x = m; x <= W - m; x += step){
    ctx.fillRect(x - 3, m - 9, 6, 16); ctx.fillRect(x - 3, H - m - 7, 6, 16);
  }
  for (var y = m; y <= H - m; y += step){
    ctx.fillRect(m - 9, y - 3, 16, 6); ctx.fillRect(W - m - 7, y - 3, 16, 6);
  }
  ctx.restore();
}

// 按"高度"给叶子配色：越靠上越亮，才像一丛有体积的灌木
function leafColor(u){
  var dr = 34, dg = 88, db = 34, lr = 108, lg = 205, lb = 92;
  u = clamp(u, 0, 1);
  return 'rgb(' + Math.round(lerp(dr, lr, u)) + ',' +
                  Math.round(lerp(dg, lg, u)) + ',' +
                  Math.round(lerp(db, lb, u)) + ')';
}

function drawBushes(){
  for (var i = 0; i < bushes.length; i++){
    var b = bushes[i], r = b.r;
    ctx.save();
    ctx.translate(b.x, b.y);
    var wob = Math.sin(runT * 1.3 + i) * 0.02;
    ctx.scale(1 + wob, 1 - wob);

    // 叶簇：一圈小叶子 + 中心大叶
    var lobes = [], count = 9, j, a2, L;
    for (j = 0; j < count; j++){
      a2 = j / count * 6.2832 + i * 0.7;
      lobes.push({
        x: Math.cos(a2) * r * 0.60,
        y: Math.sin(a2) * r * 0.46 - r * 0.06,
        rr: r * (0.34 + 0.11 * Math.sin(j * 2.1 + i))
      });
    }
    lobes.push({ x: 0, y: -r * 0.1, rr: r * 0.66 });

    // 第一遍：深色外轮廓，让叶簇之间有层次
    ctx.fillStyle = '#1f5220';
    for (j = 0; j < lobes.length; j++){
      L = lobes[j];
      ctx.beginPath(); ctx.arc(L.x, L.y, L.rr * 1.15, 0, 6.2832); ctx.fill();
    }
    // 第二遍：叶片本体
    for (j = 0; j < lobes.length; j++){
      L = lobes[j];
      var u = clamp(0.55 - L.y / (r * 1.35), 0, 1);
      ctx.fillStyle = leafColor(u);
      ctx.beginPath(); ctx.arc(L.x, L.y, L.rr, 0, 6.2832); ctx.fill();
    }
    // 顶部高光
    ctx.fillStyle = 'rgba(214,255,170,.42)';
    ctx.beginPath(); ctx.ellipse(-r * .3, -r * .48, r * .24, r * .13, -0.55, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * .26, -r * .36, r * .17, r * .1, 0.4, 0, 6.2832); ctx.fill();
    // 几颗小果子
    if (i % 3 === 0){
      ctx.fillStyle = '#d8455a';
      ctx.beginPath(); ctx.arc(-r * .42, r * .16, r * .085, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(r * .38, r * .28, r * .07, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBones(){
  for (var i = 0; i < bones.length; i++){
    var b = bones[i];
    var bob = Math.sin(b.ph) * 3;
    var pop = clamp((runT - b.born) * 5, 0, 1);
    ctx.save();
    ctx.translate(b.x, b.y + bob);
    ctx.scale(pop, pop);
    ctx.globalAlpha = .18; ctx.fillStyle = '#123a12';
    ctx.beginPath(); ctx.ellipse(0, 10 - bob, 12, 4, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    // 光晕
    var gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 28);
    gl.addColorStop(0, 'rgba(255,240,150,.9)'); gl.addColorStop(.55, 'rgba(255,235,140,.34)');
    gl.addColorStop(1, 'rgba(255,235,140,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 28, 0, 6.2832); ctx.fill();
    // 骨头
    ctx.rotate(-0.28);
    ctx.fillStyle = '#fffdf2'; ctx.strokeStyle = '#8a6a2e'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-11, -4, 22, 8, 4) : ctx.rect(-11, -4, 22, 8);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-11, -4, 4.4, 0, 6.2832); ctx.arc(-11, 4, 4.4, 0, 6.2832);
    ctx.arc(11, -4, 4.4, 0, 6.2832); ctx.arc(11, 4, 4.4, 0, 6.2832);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawDog(){
  var d = dog;
  var R = d.r;                       // 17
  var FOOT = R * 0.78;               // 脚底相对"身体中心"的 y
  var sp = Math.hypot(d.vx, d.vy);
  var moving = sp > 20;

  // 影子
  ctx.save();
  ctx.globalAlpha = .2; ctx.fillStyle = '#0e2a0e';
  ctx.beginPath(); ctx.ellipse(d.x, d.y + FOOT, R * .95, R * .34, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(d.ang);
  if (Math.cos(d.ang) < 0) ctx.scale(1, -1);

  var bounce = moving ? Math.abs(Math.sin(d.bob * 3.1)) * 2.0 : Math.sin(d.bob) * 0.8;
  ctx.translate(0, -bounce);

  var BY = -R * 0.30;                // 身体中心
  var hipY = BY + R * 0.30;
  var legT = d.bob * 1.4;

  // 四条腿（远侧两条先画、颜色略暗）
  function leg(hx, ph, dark){
    var swing = moving ? Math.sin(legT + ph) * 4.6 : 0;
    ctx.strokeStyle = dark ? '#bb7f45' : '#d29c5a';
    ctx.lineWidth = 5.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hipY); ctx.lineTo(hx + swing, FOOT); ctx.stroke();
    ctx.fillStyle = dark ? '#a86b34' : '#c98a4b';
    ctx.beginPath(); ctx.ellipse(hx + swing + 0.9, FOOT + 0.6, 3.0, 2.2, 0, 0, 6.2832); ctx.fill();
  }
  leg(-R * 0.52, 2.6, true);
  leg(R * 0.40, 1.0, true);
  leg(-R * 0.36, 0.2, false);
  leg(R * 0.55, 3.0, false);

  // 尾巴
  var wag = Math.sin(runT * (moving ? 15 : 7)) * (moving ? 0.5 : 0.32);
  ctx.save();
  ctx.translate(-R * 0.92, BY - R * 0.22);
  ctx.rotate(-0.5 + wag);
  ctx.strokeStyle = '#e0a35c'; ctx.lineWidth = 4.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-8, -4, -12, -9); ctx.stroke();
  ctx.fillStyle = '#fff4e2';
  ctx.beginPath(); ctx.arc(-12, -9, 3.1, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 身体
  var bg = ctx.createLinearGradient(0, BY - R * .7, 0, BY + R * .7);
  bg.addColorStop(0, '#fffbf1'); bg.addColorStop(0.6, '#f6e3c6'); bg.addColorStop(1, '#e2c49b');
  ctx.fillStyle = bg; ctx.strokeStyle = '#c99b62'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(0, BY, R * 1.02, R * 0.62, 0, 0, 6.2832); ctx.fill(); ctx.stroke();

  // 背上斑点
  ctx.fillStyle = 'rgba(206,142,70,.5)';
  ctx.beginPath(); ctx.ellipse(-R * .28, BY - R * .18, R * .32, R * .2, .3, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R * .2, BY - R * .26, R * .22, R * .15, -.2, 0, 6.2832); ctx.fill();

  // 头
  ctx.save();
  ctx.translate(R * 0.92, BY - R * 0.38);
  ctx.rotate(0.05);
  var HR = R * 0.55;
  var hg = ctx.createRadialGradient(-2, -3, 1, 0, 0, HR * 1.3);
  hg.addColorStop(0, '#fffdf6'); hg.addColorStop(1, '#eed7b4');
  ctx.fillStyle = hg; ctx.strokeStyle = '#c99b62'; ctx.lineWidth = 1.7;
  ctx.beginPath(); ctx.arc(0, 0, HR, 0, 6.2832); ctx.fill(); ctx.stroke();

  // 耳朵（会甩）
  var earW = moving ? Math.sin(legT * 1.1) * 0.35 : Math.sin(runT * 3) * 0.1;
  ctx.fillStyle = '#c98a4b'; ctx.strokeStyle = '#a86f36'; ctx.lineWidth = 1.3;
  ctx.save(); ctx.translate(-HR * .34, -HR * .58); ctx.rotate(-0.3 + earW);
  ctx.beginPath(); ctx.ellipse(-1, HR * .42, HR * .5, HR * .82, 0.25, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(HR * .3, -HR * .72); ctx.rotate(0.12 - earW);
  ctx.beginPath(); ctx.ellipse(0, HR * .38, HR * .46, HR * .74, -0.2, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.restore();

  // 口鼻
  ctx.fillStyle = '#fffdf6';
  ctx.beginPath(); ctx.ellipse(HR * .76, HR * .18, HR * .48, HR * .36, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#3a2a1c';
  ctx.beginPath(); ctx.ellipse(HR * 1.12, HR * .06, HR * .2, HR * .16, 0, 0, 6.2832); ctx.fill();

  // 眼睛
  ctx.fillStyle = '#2c2118';
  ctx.beginPath(); ctx.arc(HR * .36, -HR * .24, HR * .18, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(HR * .43, -HR * .31, HR * .06, 0, 6.2832); ctx.fill();

  // 舌头（跑起来会伸出来）
  if (moving){
    ctx.fillStyle = '#f08ba0';
    ctx.beginPath(); ctx.ellipse(HR * .82, HR * .5 + Math.sin(runT * 18) * .38, HR * .22, HR * .3, 0.3, 0, 6.2832); ctx.fill();
  }
  ctx.restore();  // 头

  ctx.restore();  // 小狗本体
}

function drawTiger(){
  var t = tiger;
  var R = t.r;                       // 30
  var FOOT = R * 0.70;               // 脚底 y
  var BY = -R * 0.36;                // 身体中心 y
  var BRX = R * 1.00, BRY = R * 0.52; // 身体半轴
  var HX = R * 0.98, HY = BY - R * 0.22, HR = R * 0.48; // 头
  var i;

  // 影子
  ctx.save();
  ctx.globalAlpha = .22; ctx.fillStyle = '#0e2a0e';
  ctx.beginPath(); ctx.ellipse(t.x, t.y + FOOT, R * 1.06, R * 0.30, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 视野锥（让玩家看得见"它在看哪"）
  ctx.save();
  ctx.translate(t.x, t.y); ctx.rotate(t.ang);
  var cone = ctx.createLinearGradient(0, 0, 250, 0);
  cone.addColorStop(0, t.alert ? 'rgba(255,70,40,.30)' : 'rgba(255,190,90,.14)');
  cone.addColorStop(1, 'rgba(255,70,40,0)');
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 250, -0.60, 0.60); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.ang);
  if (Math.cos(t.ang) < 0) ctx.scale(1, -1);
  ctx.translate(0, -Math.abs(Math.sin(t.legP * 0.5)) * 1.2);

  var swingAmp = t.alert ? 6.5 : 4;

  /* ---------- 腿（两段式 + 环纹 + 爪子） ---------- */
  function leg(hx, ph, dark){
    var sw = Math.sin(t.legP + ph) * swingAmp;
    var hipY = BY + BRY * 0.55;
    var kneeX = hx + sw * 0.45, kneeY = R * 0.28;
    var footX = hx + sw, footY = FOOT;
    ctx.lineCap = 'round';
    ctx.strokeStyle = dark ? '#4d4838' : '#6b6552';
    ctx.lineWidth = 6.2;
    ctx.beginPath(); ctx.moveTo(hx, hipY); ctx.lineTo(kneeX, kneeY); ctx.stroke();
    ctx.strokeStyle = dark ? '#6d6655' : '#948d7b';
    ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();
    // 小腿上的黑色环纹
    var mx = kneeX + (footX - kneeX) * 0.62, my = kneeY + (footY - kneeY) * 0.62;
    ctx.strokeStyle = '#2a251a'; ctx.lineWidth = 5.4;
    ctx.beginPath(); ctx.moveTo(mx - 1.4, my - 1.8); ctx.lineTo(mx + 1.4, my + 1.8); ctx.stroke();
    // 膝关节
    ctx.fillStyle = '#dcb34e';
    ctx.beginPath(); ctx.arc(kneeX, kneeY, 2.2, 0, 6.2832); ctx.fill();
    // 爪
    ctx.fillStyle = '#33322c';
    ctx.beginPath(); ctx.ellipse(footX + 1.4, footY + 0.8, 4.6, 2.8, 0, 0, 6.2832); ctx.fill();
  }
  leg(-R * 0.54, 1.7, true);   // 远侧后腿
  leg(R * 0.32, 0.3, true);    // 远侧前腿

  /* ---------- 尾巴（带黑环，收黑尖） ---------- */
  ctx.save();
  ctx.translate(-R * 0.86, BY - R * 0.20);
  ctx.rotate(-0.55 + Math.sin(t.legP * 0.9) * 0.30);
  ctx.lineCap = 'round';
  var seg = [[-10, -4.5, '#e0942c', 7.0], [-13.5, -6.5, '#241a0e', 6.6], [-19, -11, '#e0942c', 6.0],
             [-22, -13.5, '#241a0e', 5.4], [-27, -18, '#e0942c', 4.8], [-29.5, -20.5, '#241a0e', 4.2]];
  var px0 = 0, py0 = 0;
  for (i = 0; i < seg.length; i++){
    ctx.strokeStyle = seg[i][2]; ctx.lineWidth = seg[i][3]; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(seg[i][0], seg[i][1]); ctx.stroke();
    px0 = seg[i][0]; py0 = seg[i][1];
  }
  ctx.restore();

  /* ---------- 身体 ---------- */
  var bg = ctx.createLinearGradient(0, BY - BRY, 0, BY + BRY);
  bg.addColorStop(0, '#ffc46a');
  bg.addColorStop(0.42, '#f2a238');
  bg.addColorStop(1, '#c0741a');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, BY, BRX, BRY, 0, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, BY, BRX, BRY, 0, 0, 6.2832); ctx.clip();

  // 虎纹：弯曲的细长条（直条太粗会像蜜蜂）
  ctx.fillStyle = '#241a0e';
  var stripes = [-R * 0.78, -R * 0.46, -R * 0.14, R * 0.18];
  var top = BY - BRY - 3, bot = BY + BRY + 3;
  for (i = 0; i < stripes.length; i++){
    var sx = stripes[i];
    ctx.beginPath();
    ctx.moveTo(sx - 1.5, top);
    ctx.quadraticCurveTo(sx + 4.6, BY, sx - 2.2, bot);
    ctx.lineTo(sx + 1.2, bot);
    ctx.quadraticCurveTo(sx + 8.0, BY, sx + 2.1, top);
    ctx.closePath(); ctx.fill();
  }
  // 白肚皮
  ctx.fillStyle = 'rgba(255,243,222,.9)';
  ctx.beginPath(); ctx.ellipse(1, BY + BRY * 0.74, BRX * 0.80, BRY * 0.40, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#4a2e08'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, BY, BRX, BRY, 0, 0, 6.2832); ctx.stroke();

  // 装甲细节：中缝 + 铆钉 + 排气孔
  ctx.strokeStyle = 'rgba(74,46,8,.45)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-R * 0.62, BY - BRY * 0.42); ctx.lineTo(R * 0.26, BY - BRY * 0.42); ctx.stroke();
  ctx.fillStyle = '#f6d98d';
  for (i = -1; i <= 1; i++){
    ctx.beginPath(); ctx.arc(i * R * 0.34, BY + BRY * 0.08, 1.5, 0, 6.2832); ctx.fill();
  }
  ctx.strokeStyle = '#3a2712'; ctx.lineWidth = 1.6;
  for (i = 0; i < 3; i++){
    ctx.beginPath();
    ctx.moveTo(-R * 0.74 + i * 4.2, BY - BRY * 0.62);
    ctx.lineTo(-R * 0.74 + i * 4.2, BY - BRY * 0.26);
    ctx.stroke();
  }

  // 肩甲（金属板 + 指示灯）
  ctx.save();
  ctx.translate(R * 0.34, BY - BRY * 0.52);
  ctx.rotate(-0.18);
  ctx.fillStyle = '#6f6a5c'; ctx.strokeStyle = '#4c4840'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-9, -6, 18, 12, 3.5); else ctx.rect(-9, -6, 18, 12);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-7.5, -4.5, 15, 4, 2); else ctx.rect(-7.5, -4.5, 15, 4);
  ctx.fill();
  ctx.fillStyle = t.alert ? '#ff5b3a' : '#7ce08a';
  ctx.beginPath(); ctx.arc(5.4, 2.4, 1.8, 0, 6.2832); ctx.fill();
  ctx.restore();

  /* ---------- 近侧两条腿（画在身体之上，才有前后层次） ---------- */
  leg(-R * 0.36, 3.0, false);
  leg(R * 0.52, 1.2, false);

  /* ---------- 脖子（金属围脖，画在头之前，只露一圈） ---------- */
  ctx.save();
  ctx.translate(HX - HR * 0.62, HY + HR * 0.16);
  ctx.rotate(-0.18);
  ctx.fillStyle = '#6f6a5c'; ctx.strokeStyle = '#4c4840'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, HR * 0.34, HR * 0.66, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.ellipse(-HR * 0.06, -HR * 0.14, HR * 0.14, HR * 0.36, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(HX, HY);

  // 圆耳朵（带金属耳罩）
  function ear(ex, ey){
    ctx.save(); ctx.translate(ex, ey);
    ctx.fillStyle = '#e09a2a'; ctx.strokeStyle = '#4a2e08'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.42, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffeccb';
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.19, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = '#8f8877'; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.42, -1.15, 0.75); ctx.stroke();
    ctx.restore();
  }
  ear(-HR * 0.58, -HR * 0.70);
  ear(HR * 0.50, -HR * 0.78);

  // 头部
  var hg = ctx.createRadialGradient(-HR * 0.2, -HR * 0.45, HR * 0.15, 0, 0, HR * 1.2);
  hg.addColorStop(0, '#ffd07c');
  hg.addColorStop(0.55, '#f5a93c');
  hg.addColorStop(1, '#cd7a15');
  ctx.fillStyle = hg; ctx.strokeStyle = '#4a2e08'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, HR, 0, 6.2832); ctx.fill(); ctx.stroke();

  // 额头黑纹
  ctx.fillStyle = '#241a0e';
  var forehead = [[-0.36, -0.66, 0.14], [0.0, -0.88, 0.0], [0.36, -0.66, -0.14]];
  for (i = 0; i < forehead.length; i++){
    ctx.save();
    ctx.translate(forehead[i][0] * HR, forehead[i][1] * HR);
    ctx.rotate(forehead[i][2]);
    ctx.beginPath();
    ctx.moveTo(-HR * 0.10, 0); ctx.lineTo(HR * 0.10, 0);
    ctx.lineTo(HR * 0.055, HR * 0.46); ctx.lineTo(-HR * 0.075, HR * 0.46);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 颊侧两道短纹
  for (i = 0; i < 2; i++){
    ctx.save();
    ctx.translate(-HR * (0.70 - i * 0.06), HR * (-0.10 + i * 0.30));
    ctx.rotate(-0.62);
    ctx.beginPath();
    ctx.moveTo(-HR * 0.05, -HR * 0.17); ctx.lineTo(HR * 0.055, -HR * 0.17);
    ctx.lineTo(HR * 0.035, HR * 0.17); ctx.lineTo(-HR * 0.045, HR * 0.17);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 白口鼻
  ctx.fillStyle = '#fff7e6';
  ctx.beginPath(); ctx.ellipse(HR * 0.56, HR * 0.38, HR * 0.40, HR * 0.30, 0.10, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#e9c9a0';
  ctx.beginPath(); ctx.ellipse(HR * 0.40, HR * 0.58, HR * 0.24, HR * 0.13, 0.1, 0, 6.2832); ctx.fill();
  // 鼻子
  ctx.fillStyle = '#3a2a20';
  ctx.beginPath();
  ctx.moveTo(HR * 0.62, HR * 0.10);
  ctx.lineTo(HR * 0.94, HR * 0.14);
  ctx.lineTo(HR * 0.78, HR * 0.30);
  ctx.closePath(); ctx.fill();
  // 嘴
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(HR * 0.78, HR * 0.32); ctx.lineTo(HR * 0.60, HR * 0.44);
  ctx.moveTo(HR * 0.60, HR * 0.44); ctx.lineTo(HR * 0.42, HR * 0.36);
  ctx.stroke();
  // 虎牙
  ctx.fillStyle = '#fffdf5';
  ctx.beginPath();
  ctx.moveTo(HR * 0.50, HR * 0.40); ctx.lineTo(HR * 0.62, HR * 0.40); ctx.lineTo(HR * 0.56, HR * 0.62);
  ctx.closePath(); ctx.fill();

  // 眼睛（斜长杏眼 + 发光）
  var glow = t.alert ? 1 : 0.55;
  var eg = ctx.createRadialGradient(HR * 0.26, -HR * 0.24, 0.5, HR * 0.26, -HR * 0.24, HR * 0.95);
  eg.addColorStop(0, 'rgba(255,170,40,' + glow + ')');
  eg.addColorStop(1, 'rgba(255,140,20,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(HR * 0.26, -HR * 0.24, HR * 0.95, 0, 6.2832); ctx.fill();
  var blink = t.alert && Math.sin(runT * 22) > 0;
  ctx.fillStyle = blink ? '#fff6d0' : '#ffcf3a';
  ctx.beginPath(); ctx.ellipse(HR * 0.26, -HR * 0.28, HR * 0.24, HR * 0.18, 0.22, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = '#2e2008'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(HR * 0.26, -HR * 0.28, HR * 0.24, HR * 0.18, 0.22, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = '#241a0e';
  ctx.beginPath(); ctx.ellipse(HR * 0.30, -HR * 0.28, HR * 0.06, HR * 0.15, 0.22, 0, 6.2832); ctx.fill();

  ctx.restore();  // 头
  ctx.restore();  // 本体

  // 警报感叹号
  if (t.alert){
    ctx.save();
    ctx.translate(t.x, t.y - R - 26 + Math.sin(runT * 8) * 2);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e63a1c';
    ctx.font = '800 22px ui-rounded, system-ui, sans-serif';
    ctx.fillText('!', 0, 0);
    ctx.beginPath(); ctx.arc(0, 6, 2.4, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}


function drawParticles(){
  for (var i = 0; i < puffs.length; i++){
    var p = puffs[i];
    var a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a * (p.c === 'smoke' ? 0.55 : 0.34);
    ctx.fillStyle = p.c === 'smoke' ? '#d8d2c4' : '#d9e8b8';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (var j = 0; j < sparks.length; j++){
    var s = sparks[j];
    ctx.globalAlpha = clamp(s.life / s.max, 0, 1);
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawStick(){
  if (!stick.active) return;
  var dx = stick.x - stick.ox, dy = stick.y - stick.oy;
  var l = Math.hypot(dx, dy), max = 62;
  var k = l > max ? max / l : 1;
  ctx.save();
  ctx.globalAlpha = .3;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, max, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = .55;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 18, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawVignette(){
  var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(12,32,8,.34)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  }
  drawLawn();
  drawBushes();
  drawBones();
  drawDog();
  drawTiger();
  drawParticles();
  drawStick();
  ctx.restore();
  drawVignette();
  drawFence();

  // 开局倒计时
  if (state === 'playing' && graceT > 0){
    var n = Math.ceil(graceT);
    var frac = graceT - Math.floor(graceT);
    var size = Math.min(W, H) * (0.15 + 0.045 * (1 - frac));
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(size) + 'px ui-rounded, system-ui, sans-serif';
    ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(n, W / 2, H / 2 - size * 0.12);
    ctx.fillStyle = '#e0642f';
    ctx.fillText(n, W / 2, H / 2 - size * 0.12);
    ctx.font = '800 ' + Math.round(size * 0.26) + 'px ui-rounded, system-ui, sans-serif';
    ctx.lineWidth = 7;
    ctx.strokeText('小狗快跑！', W / 2, H / 2 + size * 0.72);
    ctx.fillStyle = '#37412f';
    ctx.fillText('小狗快跑！', W / 2, H / 2 + size * 0.72);
    ctx.restore();
  }

  if (state === 'paused'){
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2b2f26'; ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(Math.min(W, H) * 0.075) + 'px ui-rounded, system-ui, sans-serif';
    ctx.fillText('暂停中', W / 2, H / 2 - 6);
    ctx.font = '600 16px ui-rounded, system-ui, sans-serif';
    ctx.fillStyle = '#6b7562';
    ctx.fillText('按 P 继续', W / 2, H / 2 + 30);
    ctx.restore();
  }

  if (state === 'over'){
    // 抓捕瞬间的红闪
    if (catchT > 0){
      ctx.save();
      ctx.globalAlpha = clamp(catchT, 0, .5);
      ctx.fillStyle = '#e63a1c'; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }
}

/* ---------------- 循环 ---------------- */
function loop(now){
  requestAnimationFrame(loop);
  // rAF 的时间戳可能早于上一帧记录的时间（例如点击后同一帧内的回调），
  // 必须夹到 [0, 1/30]，否则会出现负的 dt，让时间倒流、分数为负。
  var raw = (now - lastT) / 1000;
  var dt = isFinite(raw) ? Math.max(0, Math.min(raw, 1 / 30)) : 0;
  lastT = now;

  if (state === 'playing') update(dt);
  else runT += dt;

  if (state === 'over' && catchT > 0) catchT = Math.max(0, catchT - dt * 1.6);

  el.score.textContent = Math.floor(score);
  el.time.textContent = elapsed.toFixed(1);
  if (state !== 'menu') el.best.textContent = Math.max(best, Math.floor(score));

  render();
}

/* ---------------- 流程 ---------------- */
function startGame(){
  audio();
  resize();
  resetWorld();
  graceT = 2.9;
  state = 'playing';
  el.start.hidden = true;
  el.over.hidden = true;
  el.best.textContent = best;
  lastT = performance.now();
  tone(520, .1, 'sine', .12, 780);
}
function gameOver(){
  state = 'over';
  catchT = 0.5; shake = 9;
  noise(0.4, 0.2, 200);
  tone(180, .5, 'sawtooth', .18, 60);
  var sc = Math.floor(score);
  var isNew = sc > best;
  if (isNew){
    best = sc;
    try { localStorage.setItem('roboTigerBest2', String(best)); } catch(e){}
  }
  el.finalScore.textContent = sc;
  el.finalTime.textContent = elapsed.toFixed(1) + 's';
  el.finalBones.textContent = boneCount;
  el.newBest.hidden = !isNew;
  el.best.textContent = best;
  el.alert.classList.remove('on');
  var quips = [
    ['被抓住啦！', '虎口脱险失败…… 再来一次！'],
    ['机械老虎赢了这局', '差一点点，下次记得用冲刺拐弯。'],
    ['小狗被逮到了 🐯', '钻灌木丛可以甩掉它的视线哦。'],
    ['哎呀，被抓到了', '捡骨头能加分，但别贪心。']
  ];
  var q = quips[randInt(0, quips.length - 1)];
  el.overTitle.textContent = q[0];
  el.overSub.textContent = q[1];
  setTimeout(function(){ el.over.hidden = false; }, 420);
}
function togglePause(){
  if (state === 'playing'){
    state = 'paused'; el.alert.classList.remove('on');
  } else if (state === 'paused'){
    state = 'playing'; lastT = performance.now();
  }
}
function toggleMute(){
  sound.on = !sound.on;
  el.mute.textContent = sound.on ? '🔊' : '🔇';
  el.mute.classList.toggle('off', !sound.on);
  if (sound.on) tone(660, .08, 'sine', .1);
}

el.start.querySelector('#playBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
el.mute.addEventListener('click', toggleMute);
el.fs.addEventListener('click', function(){
  if (!document.fullscreenElement){
    (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
  } else {
    (document.exitFullscreen || function(){}).call(document);
  }
});
['pointerdown', 'pointerup'].forEach(function(ev){
  el.dash.addEventListener(ev, function(e){
    e.preventDefault();
    if (ev === 'pointerdown'){ touchDash = true; tryDash(); }
    else touchDash = false;
  });
});

function enableTouchUI(){
  if (el.dash.dataset.on === '1') return;
  el.dash.dataset.on = '1';
  el.dash.style.display = 'grid';
}
if ((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
    ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0){
  enableTouchUI();
}

/* 圆角矩形兜底 */
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

resize();
resetWorld();
state = 'menu';
requestAnimationFrame(function(t){ lastT = t; loop(t); });

})();
</script>
